<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #0b3d24;
    --pine-deep: #041b10;
    --red: #c0392b;
    --gold: #e8c15a;
    --snow: #fefefe;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, var(--pine) 0%, var(--pine-deep) 75%);
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  #snow-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 24px;
  }
  .tree {
    font-size: clamp(48px, 8vw, 84px);
    margin-bottom: 8px;
    filter: drop-shadow(0 0 18px rgba(232, 193, 90, 0.55));
  }
  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(34px, 7vw, 62px);
    margin: 0 0 6px 0;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: var(--snow);
    opacity: 0.8;
    font-size: clamp(13px, 2vw, 16px);
    margin-bottom: 36px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .countdown {
    display: flex;
    gap: clamp(12px, 3vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: rgba(232, 193, 90, 0.08);
    border: 1px solid rgba(232, 193, 90, 0.4);
    border-radius: 16px;
    padding: clamp(14px, 3vw, 24px) clamp(16px, 3.5vw, 28px);
    min-width: 88px;
    backdrop-filter: blur(4px);
  }
  .unit .value {
    font-family: 'Mountains of Christmas', cursive;
    font-weight: 700;
    font-size: clamp(36px, 7.5vw, 64px);
    color: var(--gold);
    line-height: 1;
  }
  .unit .label {
    margin-top: 8px;
    font-size: clamp(10px, 1.6vw, 13px);
    color: var(--snow);
    opacity: 0.7;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .done {
    font-family: 'Mountains of Christmas', cursive;
    color: var(--gold);
    font-size: clamp(28px, 6vw, 46px);
  }
</style>
</head>
<body>
<canvas id="snow-canvas"></canvas>
<div class="stage">
  <div class="tree">🎄</div>
  <h1>Christmas Countdown</h1>
  <div class="subtitle">Friday, December 25, 2026</div>
  <div id="countdown" class="countdown"></div>
</div>

<script>
  const targetDate = new Date("2026-12-25T00:00:00");
  const countdownEl = document.getElementById("countdown");

  function render() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      countdownEl.innerHTML = '<div class="done">🎅 Merry Christmas! 🎅</div>';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    const units = [
      [days, "Days"],
      [hours, "Hours"],
      [minutes, "Minutes"],
      [seconds, "Seconds"],
    ];

    countdownEl.innerHTML = units.map(([value, label]) => `
      <div class="unit">
        <div class="value">${String(value).padStart(2, "0")}</div>
        <div class="label">${label}</div>
      </div>
    `).join("");
  }

  render();
  setInterval(render, 1000);

  // Falling snow
  const canvas = document.getElementById("snow-canvas");
  const ctx = canvas.getContext("2d");
  let flakes = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function makeFlake() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      radius: Math.random() * 2.5 + 1,
      speed: Math.random() * 1 + 0.4,
      drift: Math.random() * 0.6 - 0.3,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.02 + 0.005,
    };
  }

  const FLAKE_COUNT = 130;
  for (let i = 0; i < FLAKE_COUNT; i++) flakes.push(makeFlake());

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(254, 254, 254, 0.9)";
    for (const f of flakes) {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
      ctx.fill();

      f.y += f.speed;
      f.sway += f.swaySpeed;
      f.x += f.drift + Math.sin(f.sway) * 0.3;

      if (f.y > canvas.height + 5) {
        Object.assign(f, makeFlake(), { y: -5 });
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
