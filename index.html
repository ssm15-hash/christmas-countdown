<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --holly-green: #17a04a;
    --berry-red: #e6323a;
    --red: #ef4444;
    --green: #22c55e;
    --gold: #ffd23f;
    --snow: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, var(--berry-red) 0%, var(--holly-green) 55%, #0e7a37 100%);
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  #snow-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 24px;
  }
  .emoji-row {
    font-size: clamp(40px, 7vw, 68px);
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
  }
  .emoji-row span {
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(255, 210, 63, 0.6));
  }
  .emoji-row span:nth-child(2) { animation-delay: 0.2s; }
  .emoji-row span:nth-child(3) { animation-delay: 0.4s; }
  .emoji-row span:nth-child(4) { animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(-6deg); }
  }
  h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    color: var(--gold);
    font-size: clamp(32px, 7vw, 58px);
    margin: 0 0 6px 0;
    letter-spacing: 0.5px;
    text-shadow: 0 3px 0 var(--red);
  }
  .subtitle {
    color: var(--snow);
    opacity: 0.95;
    font-family: 'Baloo 2', cursive;
    font-weight: 600;
    font-size: clamp(15px, 2.4vw, 20px);
    margin-bottom: 36px;
    letter-spacing: 1px;
  }
  .countdown {
    display: flex;
    gap: clamp(12px, 3vw, 24px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: var(--red);
    border: 4px solid var(--snow);
    border-radius: 20px;
    padding: clamp(14px, 3vw, 22px) clamp(14px, 3vw, 24px);
    min-width: 84px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2);
  }
  .unit:nth-child(even) {
    background: var(--green);
  }
  .unit .value {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(32px, 7vw, 56px);
    color: var(--snow);
    line-height: 1;
  }
  .unit .label {
    margin-top: 8px;
    font-family: 'Baloo 2', cursive;
    font-weight: 600;
    font-size: clamp(11px, 1.8vw, 14px);
    color: var(--snow);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .done {
    font-family: 'Baloo 2', cursive;
    color: var(--gold);
    font-size: clamp(28px, 6vw, 46px);
  }
</style>
</head>
<body>
<canvas id="snow-canvas"></canvas>
<div class="stage">
  <div class="emoji-row">
    <span>🎄</span><span>🎅</span><span>🎁</span><span>⭐</span>
  </div>
  <h1>Christmas Countdown!</h1>
  <div class="subtitle">🎉 Santa comes on Friday, December 25, 2026! 🎉</div>
  <div id="countdown" class="countdown"></div>
</div>

<script>
  const targetDate = new Date("2026-12-25T00:00:00");
  const countdownEl = document.getElementById("countdown");

  function render() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      countdownEl.innerHTML = '<div class="done">🎅🎄 Merry Christmas!! 🎄🎅</div>';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    const units = [
      [days, "Days"],
      [hours, "Hours"],
      [minutes, "Minutes"],
      [seconds, "Seconds"],
    ];

    countdownEl.innerHTML = units.map(([value, label]) => `
      <div class="unit">
        <div class="value">${String(value).padStart(2, "0")}</div>
        <div class="label">${label}</div>
      </div>
    `).join("");
  }

  render();
  setInterval(render, 1000);

  // Falling snow
  const canvas = document.getElementById("snow-canvas");
  const ctx = canvas.getContext("2d");
  let flakes = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const flakeColors = ["#ffffff", "#ffd23f", "#7dd3fc"];

  function makeFlake() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      radius: Math.random() * 4 + 3,
      speed: Math.random() * 1 + 0.5,
      drift: Math.random() * 0.6 - 0.3,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.02 + 0.005,
      spin: Math.random() * Math.PI * 2,
      spinSpeed: Math.random() * 0.05 - 0.025,
      color: flakeColors[Math.floor(Math.random() * flakeColors.length)],
    };
  }

  const FLAKE_COUNT = 100;
  for (let i = 0; i < FLAKE_COUNT; i++) flakes.push(makeFlake());

  function drawSnowflake(x, y, radius, angle, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, radius / 4);
    ctx.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(-radius, 0);
      ctx.lineTo(radius, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const f of flakes) {
      drawSnowflake(f.x, f.y, f.radius, f.spin, f.color);

      f.y += f.speed;
      f.sway += f.swaySpeed;
      f.spin += f.spinSpeed;
      f.x += f.drift + Math.sin(f.sway) * 0.3;

      if (f.y > canvas.height + 5) {
        Object.assign(f, makeFlake(), { y: -5 });
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
